<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gifs Searcher</title>
  </head>
  <body>

    <div class="content">
        <div class="swiper">
          <!-- Additional required wrapper -->
          <div class="swiper-wrapper">
            <!-- Slides -->
            <div class="swiper-slide"><img id="img-1"/></div>
            <div class="swiper-slide"><img id="img-2"/></div>
            <div class="swiper-slide"><img id="img-3"/></div>
          </div>
          <!-- If we need pagination -->
          <div class="swiper-pagination"></div>
    
          <!-- If we need navigation buttons -->
          <div class="swiper-button-prev"></div>
          <div class="swiper-button-next"></div>
        </div>

        <div class="search">
            <div class="search-field">
                <input id="searchInput" type="text" placeholder="Search all the GIFs">
                <span id="error" class="error">Error</span>
            </div>
            <button id="sendBtn" type="submit" class="send">Search</button>
        </div>
    </div>

  </body>
</html>
